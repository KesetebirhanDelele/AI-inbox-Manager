name: Backup Neon Database

# Neon's free tier only gives a 6-hour point-in-time-recovery window and a
# single manual snapshot slot (no scheduled snapshots) -- thin insurance for
# an unattended system that writes to it every 2 hours with nobody watching
# in real time. This takes a daily pg_dump and keeps 30 days of them as
# workflow artifacts, independent of Neon's own retention entirely.

on:
  schedule:
    - cron: '0 6 * * *'   # Once daily, 6am UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Ubuntu's default postgresql-client (16.x) refuses to dump from Neon's
      # Postgres 18 server ("aborting because of server version mismatch") --
      # use PGDG's official repo to get a client new enough.
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # pipefail so a failed pg_dump fails this step instead of being
          # masked by gzip's own (successful) exit code -- this exact bug
          # produced a "successful" 20-byte empty backup on 2026-09-19.
          set -euo pipefail
          mkdir -p backup
          out="backup/neon-backup-$(date +%Y%m%d).sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > "$out"
          test -s "$out"  # fail loudly if the dump came out empty
          ls -lh backup/

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-backup-${{ github.run_number }}
          path: backup/
          retention-days: 30
