version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: email_dashboard_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend (development)
  api:
    build:
      context: ../..
      dockerfile: services/dashboard/api/Dockerfile.dev
    container_name: email_dashboard_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8010:8000"  # host 8000 was already taken by another local project
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/email_dashboard
      ENVIRONMENT: development
      DEBUG: "false"
      LOG_LEVEL: INFO
      SESSION_SECRET: local-dev-session-secret
      # Local dev login only — password is "admin123". Change/rotate for anything beyond your own machine.
      ADMIN_PASSWORD_HASH: $$2b$$12$$VrQEs11/UlWqNKsBOmhP..S3.tfe22QTDHfHz2IC43GMe7GFEq4/O
    # process_runner.py walks up 5 parent dirs from its own file to find the
    # repo root (matching its real path when run outside Docker). Mounting the
    # whole repo at the same relative depth keeps that path math correct,
    # instead of flattening api/execution/config into separate /app/* mounts.
    working_dir: /repo/services/dashboard/api
    volumes:
      - ../..:/repo
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # React frontend (development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: email_dashboard_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8010
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

  # Local replacement for the GitHub Actions cron trigger (process_inbox.yml)
  cron:
    build:
      context: ../../
      dockerfile: execution/Dockerfile.cron
    container_name: email_dashboard_cron
    # process_inbox_auto.py adds services/dashboard/api to sys.path (to import
    # models for writing ProcessRun/Email rows) using a path computed relative
    # to its own file location. That only resolves if the container mirrors
    # the real repo layout -- same reasoning as the api service's mount below.
    working_dir: /repo
    volumes:
      - ../..:/repo
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
